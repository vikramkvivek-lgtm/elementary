<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diamond 26: ABS Edition</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
  <div class="board" id="board"></div>      <!-- scoreboard (scoreboard.js) -->
  <div class="field">
    <canvas id="cv"></canvas>               <!-- the field picture (draw-*.js) -->
    <div class="call" id="call"></div>      <!-- big "Home run!" text (scoreboard.js) -->
  </div>
  <div class="panel" id="panel"></div>      <!-- menu and buttons (panel.js) -->
  <ul class="log" id="log"></ul>            <!-- play-by-play -->
</div>

<!-- The game code, split by topic. Order matters: main.js must be last. -->
<script src="js/rosters.js"></script>
<script src="js/setup.js"></script>
<script src="js/missions.js"></script>
<script src="js/flow.js"></script>
<script src="js/batting.js"></script>
<script src="js/pitching.js"></script>
<script src="js/umpire.js"></script>
<script src="js/baserunning.js"></script>
<script src="js/outcomes.js"></script>
<script src="js/scoreboard.js"></script>
<script src="js/panel.js"></script>
<script src="js/input.js"></script>
<script src="js/draw-field.js"></script>
<script src="js/pitchers.js"></script>
<script src="js/draw-people.js"></script>
<script src="js/draw-overlays.js"></script>
<script src="js/main.js"></script>
</body>
</html>

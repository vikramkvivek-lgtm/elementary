<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diamond 26: ABS Edition</title>
<style>
:root{
  --page:#E4EBE2; --text:#14261B; --muted:#4F6054; --panel:#FFFFFF; --line:#C6D2C6;
  --board:#10261C; --board-text:#F3F0E6; --board-muted:#8FA596; --bulb:#F5B841; --bulb-off:#2E4236;
  --btn:#1F4A31; --btn-text:#F6F3EA; --btn2:#EEF2EC; --btn2-text:#14261B;
  --accent:#B8432B; --call:#FFFFFF; --call-shadow:rgba(0,0,0,.55);
  --cond:"Avenir Next Condensed","Roboto Condensed","Arial Narrow","Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0B140F; --text:#E6ECE4; --muted:#9BAC9F; --panel:#15231A; --line:#2A3C30;
    --board:#0A1B12; --board-text:#F3F0E6; --board-muted:#7E9585; --bulb:#F5B841; --bulb-off:#25362B;
    --btn:#2F6B45; --btn-text:#F6F3EA; --btn2:#1E2F24; --btn2-text:#E6ECE4;
    --accent:#E2694F; --call:#FFFFFF; --call-shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
html[data-theme="dark"]{
    --page:#0B140F; --text:#E6ECE4; --muted:#9BAC9F; --panel:#15231A; --line:#2A3C30;
    --board:#0A1B12; --board-text:#F3F0E6; --board-muted:#7E9585; --bulb:#F5B841; --bulb-off:#25362B;
    --btn:#2F6B45; --btn-text:#F6F3EA; --btn2:#1E2F24; --btn2-text:#E6ECE4;
    --accent:#E2694F; --call:#FFFFFF; --call-shadow:rgba(0,0,0,.6);
    color-scheme:dark;
  }
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--page);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:460px;margin:0 auto;padding:8px 8px 24px}
.board{background:var(--board);color:var(--board-text);border-radius:10px;padding:8px 10px 10px;font-family:var(--cond);font-weight:700}
.line{width:100%;border-collapse:collapse;font-size:15px;text-align:center}
.line th{color:var(--board-muted);font-weight:600;font-size:12px;padding:0 2px 2px}
.line td{padding:2px;color:var(--bulb);font-variant-numeric:tabular-nums}
.line td.tm{text-align:left;color:var(--board-text);letter-spacing:.02em;width:30%}
.line td.r{color:var(--board-text);font-size:17px}
.status{display:flex;align-items:center;justify-content:space-between;margin-top:6px;gap:8px}
.count{display:grid;grid-template-columns:auto auto;gap:2px 6px;font-size:13px;align-items:center}
.count span{color:var(--board-muted)}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bulb-off)}
.dot.on{background:var(--bulb);box-shadow:0 0 6px var(--bulb)}
.readout{font-size:13px;color:var(--board-muted);text-align:right;line-height:1.25}
.readout b{color:var(--bulb);font-size:20px;display:block}
.field{position:relative;margin-top:8px;border-radius:10px;overflow:hidden;touch-action:none}
canvas{display:block;width:100%;aspect-ratio:360/440}
.call{position:absolute;left:0;right:0;top:34%;text-align:center;font-family:var(--cond);font-weight:800;font-size:44px;color:var(--call);text-shadow:0 3px 12px var(--call-shadow);pointer-events:none;opacity:0;letter-spacing:.01em;line-height:1}
.call small{display:block;font-size:17px;font-weight:600;margin-top:6px}
.call.show{animation:pop 1.5s ease forwards}
@keyframes pop{0%{opacity:0;transform:scale(.7)}12%{opacity:1;transform:scale(1.06)}20%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.call.show{animation:none;opacity:1}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-top:8px;padding:12px}
.who{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.who h2{margin:0;font-family:var(--cond);font-size:24px;font-weight:800;line-height:1.1}
.who .pos{color:var(--muted);font-size:14px;white-space:nowrap}
.today{color:var(--muted);font-size:14px;margin:2px 0 8px}
.rate{display:grid;grid-template-columns:40px 1fr 26px;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--btn)}
.hint{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.4}
.pitches{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;min-height:44px}
button:focus-visible{outline:3px solid var(--bulb);outline-offset:2px}
.pbtn{background:var(--btn2);color:var(--btn2-text);padding:8px 4px;font-family:var(--cond);font-weight:700;font-size:16px;line-height:1.1}
.pbtn small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.pbtn.sel{background:var(--btn);color:var(--btn-text)}
.pbtn.sel small{color:var(--btn-text)}
.go{background:var(--btn);color:var(--btn-text);width:100%;margin-top:10px;font-family:var(--cond);font-weight:800;font-size:20px}
.ghost{background:transparent;color:var(--text);border:1px solid var(--line);padding:0 12px;font-size:14px;min-height:36px}
.meter{position:relative;height:22px;border-radius:11px;background:linear-gradient(90deg,var(--accent),var(--bulb) 38%,var(--btn) 47%,var(--btn) 53%,var(--bulb) 62%,var(--accent));margin-top:10px}
.needle{position:absolute;top:-4px;width:4px;height:30px;background:var(--text);border-radius:2px;margin-left:-2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:10px}
.energy{flex:1}
.log{list-style:none;margin:8px 2px 0;padding:0;font-size:13px;color:var(--muted);line-height:1.45}
.log li:first-child{color:var(--text)}
h1{font-family:var(--cond);font-weight:800;font-size:38px;margin:0;line-height:1}
.sub{color:var(--muted);font-size:14px;margin:4px 0 12px}
.lineup{margin:0;padding:0 0 0 22px;font-size:14px;line-height:1.55;columns:2;column-gap:14px}
.lineup span{color:var(--muted)}
.lbl{font-size:13px;color:var(--muted);margin:14px 0 6px}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choices button{background:var(--btn2);color:var(--btn2-text);padding:0 12px;font-size:14px;flex:1 1 auto}
.choices button.sel{background:var(--btn);color:var(--btn-text)}
.final{font-family:var(--cond);font-weight:800;font-size:46px;margin:4px 0}
.chal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.chal .go{margin-top:0}
.timer{height:4px;background:var(--line);border-radius:2px;margin-top:10px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--accent)}
.perf{font-size:14px;line-height:1.6;margin:8px 0 0;padding-left:18px}
</style>
</head>

window.addEventListener("resize",resize);

// ---------- Missions ----------

const EVT={"1B":"Single","2B":"Double","3B":"Triple","HR":"Home run!","OUT":"Out","ball":"Ball","called":"Strike","swinging":"Swing and a miss","foul":"Foul"};

  const M=S.mission;
  S.b=0;S.s=0;S.bases=[null,null,null];
  const counts=!(M.type==="bat"&&(evt==="ball"||evt==="called"));
  if(counts)M.used++;
  const hit=M.counts.includes(evt);if(hit)M.prog++;
  if(M.type==="pitch")S.idx.cpu++;
  if(evt==="HR"&&navigator.vibrate)navigator.vibrate([40,40,80]);
  renderBoard();
  showCall(EVT[evt]||evt,hit?M.unit+": "+M.prog+" of "+M.need:(M.shots-M.used)+" left");
  S.phase="idle";
  if(M.prog>=M.need)return setTimeout(()=>missionEnd(true),1500);
  if(M.used>=M.shots)return setTimeout(()=>missionEnd(false),1500);
  renderPanel();setTimeout(nextPitch,1400);
}
function missionEnd(won){
  S.phase="mission-over";S.over=true;S.missionWon=won;renderPanel();
  showCall(won?"Mission complete":"Mission failed",S.mission.unit+": "+S.mission.prog+" of "+S.mission.need);
  if(won&&navigator.vibrate)navigator.vibrate([60,40,60,40,120]);
}

// ---------- Flow ----------
function startHalf(){
  S.outs=0;S.b=0;S.s=0;S.bases=[null,null,null];S.stealOn=null;S.sacOn=false;S.diseng=0;S.cpuWillSteal=null;
  S.runs[batTeam()][S.inn-1]=0;
  if(S.inn>S.innings&&S.half===0)["you","cpu"].forEach(t=>{if(S.chal[t]===0){S.chal[t]=1;}});
  renderBoard();
  showCall((S.half?"Bottom ":"Top ")+ord(S.inn), S.half? "You’re pitching":"You’re batting");
  S.phase="idle";renderPanel();
  setTimeout(nextPitch,1600);
}
function nextPitch(){
  if(!S||S.over)return;
  S.P=null;S.Hit=null;S.ring=null;
  if(batTeam()==="you"){cpuThrow();}
  else{
    const B=S.bases;S.cpuWillSteal=null;
    if(S.mode==="game"){
      if(B[0]&&!B[1]&&B[0].s>=75&&Math.random()<0.3)S.cpuWillSteal=0;
      else if(B[1]&&!B[2]&&B[1].s>=88&&Math.random()<0.15)S.cpuWillSteal=1;
    }
    S.phase="select";S.sel=null;S.aim=null;renderPanel();
  }
}
function cpuThrow(){
  if(S.cpuP===0&&S.cpuPC>=CPU.staff[0].lim){S.cpuP=1;logMsg(CPU.name+" goes to the bullpen: "+cpuPitcher().n+".");}
  const p=cpuPitcher(),pt=pick(p.ar);
  let strikeP=S.mode==="mission"?0.78:(S.b===3?0.78:(S.s===2&&S.b<2?0.38:0.56));
  let x,y;
  if(Math.random()<strikeP){x=(Math.random()<.5?-1:1)*rnd(0.15,0.95);y=(Math.random()<.5?-1:1)*rnd(0.1,0.95);}
  else if(Math.random()<.5){x=(Math.random()<.5?-1:1)*rnd(1.12,1.6);y=rnd(-1.3,1.3);}
  else{x=rnd(-1.2,1.2);y=(Math.random()<.5?-1:1)*rnd(1.12,1.55);}
  S.cpuPC++;
  launchPitch(p,pt,[x,y],"bat");
}
function launchPitch(p,pt,target,mode){
  const dur=(520+(100-pt[1])*28)*S.D.fly;
  const rel=releasePoint(p);
  S.P={p,pt,target,rel,brk:[pt[2],pt[3]],mode,t0:performance.now()+850*styleOf(p).tempo,wind:performance.now(),dur,swung:false,done:false,pending:null};
  S.phase=mode==="bat"?"flight-bat":"flight-pitch";
  S.last=pt[1]+" mph "+pt[0];
  renderPanel();
}
function ballPos(P,t){
  const tt=clamp(t,0,1);
  const [tx,ty]=toScreen(P.target);
  const bx=P.brk[0]*ZW/2, by=-P.brk[1]*ZH/2;
  const sx=P.rel[0]+(tx-bx-P.rel[0])*tt, sy=P.rel[1]+(ty-by-P.rel[1])*tt;
  const k=tt*tt*tt;
  return [sx+bx*k, sy+by*k, 2+9*Math.pow(tt,1.6)];
}

// ---------- Your at-bat ----------
function swing(x,y,now){
  const P=S.P;if(!P||P.swung||P.done||now<P.t0)return;
  P.swung=true;S.ring={x,y,t:now};
  const t=(now-P.t0)/P.dur, err=(t-1)*P.dur, a=Math.abs(err), D=S.D;
  const fin=toScreen(P.target), d=Math.hypot(x-fin[0],y-fin[1])/ZW;
  if(a>D.ok||d>D.reach){
    const why=a>D.ok?(err<0?"Way out in front":"Too late"):(y<fin[1]?"Swung over it":"Swung under it");
    P.pending={k:"whiff",why};return;
  }
  const ts=1-0.8*clamp((a-D.perfect)/(D.ok-D.perfect),0,1), ss=1-d/D.reach, q=ts*0.55+ss*0.45;
  const b=curBatter();
  P.done=true;
  const cp=ballPos(P,t);
  if(q<0.38||(q<0.5&&Math.random()<0.5)){foulAnim(cp);setTimeout(()=>{callPitch("foul");},700);return;}
  const e=q+(b.pw-80)/200+(b.c-80)/400+(Math.random()-0.5)*0.25-(cpuPitcher().st-80)/400;
  const pull=err<0?"pull":"oppo";
  hitResult(e,b,cp,pull,0);
}
function resolveTake(){
  const P=S.P;P.done=true;
  umpDecides(P.target);
}

// ---------- Your pitching ----------
function choosePitch(i){if(S.phase!=="select"&&S.phase!=="aim")return;S.sel=i;S.phase="aim";renderPanel();}
function aimAt(x,y){
  if(S.phase!=="aim")return;
  const [nx,ny]=toZone(x,y);S.aim=[clamp(nx,-1.8,1.8),clamp(ny,-1.8,1.8)];
  S.phase="meter";S.meterT0=performance.now();renderPanel();
}
function meterPos(now){return (Math.sin((now-S.meterT0)/S.D.meter*Math.PI*2-Math.PI/2)+1)/2;}
function fatigue(){const p=myPitcher(),pc=S.pc[p.n]||0,lim=55+p.stam*0.45;return {f:clamp((pc-lim*0.75)/(lim*0.5),0,1),e:clamp(1-pc/lim,0,1),pc};}
function release(){
  if(S.phase!=="meter")return;
  const pos=meterPos(performance.now()),acc=1-Math.abs(pos-0.5)*2;
  const p=myPitcher(),pt=p.ar[S.sel],{f}=fatigue();
  const err=((1-acc)*0.85+(100-p.ctl)/260+f*0.5)*rnd(0.4,1),ang=rnd(0,Math.PI*2);
  const target=[S.aim[0]+Math.cos(ang)*err,S.aim[1]+Math.sin(ang)*err];
  S.pc[p.n]=(S.pc[p.n]||0)+1;
  S.relAcc=acc;
  if(S.cpuWillSteal!=null&&S.bases[S.cpuWillSteal]&&!S.bases[S.cpuWillSteal+1]){S.stealOn=S.cpuWillSteal;logMsg("The runner is going!");}
  S.cpuWillSteal=null;
  launchPitch(p,pt,target,"pitch");
  S.P.t0=performance.now()+520*styleOf(myPitcher()).tempo;S.P.wind=performance.now();
}
function resolveCpuAB(){
  const P=S.P;P.done=true;
  const b=curBatter(),[x,y]=P.target,cd=Math.max(Math.abs(x),Math.abs(y)),inZ=cd<=1.02,meat=cd<0.45;
  const p=myPitcher(),{f}=fatigue();
  let stuff=(p.st-80)/250+(Math.abs(P.brk[0])+Math.abs(P.brk[1]))*0.03-f*0.15+(S.relAcc>0.92?0.04:0)-S.D.cpuBoost;
  let sw=inZ?0.62+(meat?0.15:0):clamp(0.3-(cd-1)*0.6,0.03,0.3)*(S.s===2?1.3:1)*(1+stuff);
  if(S.b===3&&!inZ)sw*=0.55;
  if(Math.random()>=sw){umpDecides(P.target);return;}
  let con=(inZ?0.86:0.55)+(b.c-75)/180-stuff*0.7-(inZ&&cd>0.75?0.03:0);
  if(Math.random()>con){S.ring={x:toScreen(P.target)[0]+rnd(-14,14),y:toScreen(P.target)[1]+rnd(-14,14),t:performance.now()};callPitch("swinging");return;}
  const cp=toScreen(P.target);
  if(Math.random()<0.34){foulAnim(cp);setTimeout(()=>callPitch("foul"),700);return;}
  const e=0.62+(meat?0.18:0)-(inZ&&cd>0.75?0.03:0)-(!inZ?0.1:0)+(b.pw-75)/180+(Math.random()-0.5)*0.5-stuff*0.4+Math.min(0.15,(S.cpuDry||0)*0.02);
  hitResult(e,b,cp,Math.random()<.5?"pull":"oppo",1);
}

// ---------- Umpire and ABS ----------
const absStrike=([x,y])=>Math.abs(x)<=1.06&&Math.abs(y)<=1.06;
const edgeDist=([x,y])=>Math.abs(Math.max(Math.abs(x),Math.abs(y))-1.06);
function umpDecides(loc){
  if(S.mode==="mission")return callPitch(absStrike(loc)?"called":"ball");
  const truth=absStrike(loc)?"called":"ball",d=edgeDist(loc);
  S.umpCount=(S.umpCount||0)+1;
  if(!S.umpNext)S.umpNext=Math.random()<.5?3:4;
  const miss=S.umpCount>=S.umpNext;
  if(miss){S.umpCount=0;S.umpNext=Math.random()<.5?3:4;}
  const call=miss?(truth==="called"?"ball":"called"):truth;
  const hurt=call==="called"?batTeam():(batTeam()==="you"?"cpu":"you");
  S.pend={call,truth,loc,hurt};
  if(hurt==="you"&&S.chal.you>0){
    S.phase="challenge";S.chalEnd=performance.now()+4500;
    showCall(call==="called"?"Strike":"Ball","Ump "+UMP.n.split(" ")[1]);
    renderPanel();return;
  }
  if(hurt==="cpu"&&S.chal.cpu>0){
    let pr=call!==truth?0.72:(d<0.12?0.18:0.03);
    if((call==="called"&&S.s===2)||(call==="ball"&&S.b===3))pr+=0.2;
    if(Math.random()<pr){
      showCall(call==="called"?"Strike":"Ball","Ump "+UMP.n.split(" ")[1]);
      S.phase="idle";renderPanel();
      setTimeout(()=>runChallenge("cpu"),1000);return;
    }
  }
  callPitch(call);
}
function acceptCall(){if(S.phase!=="challenge")return;S.phase="idle";callPitch(S.pend.call);}
function runChallenge(team){
  const c=S.pend;S.phase="abs";
  S.abs={t0:performance.now(),loc:c.loc,over:c.call!==c.truth,truth:c.truth};
  logMsg((team==="you"?"You challenge":CPU.name+" challenges")+" the "+(c.call==="called"?"strike":"ball")+" call.");
  renderPanel();
  setTimeout(()=>{
    const over=c.call!==c.truth;
    if(!over)S.chal[team]--;
    renderBoard();
    showCall(over?"Overturned":"Call stands",over?(c.truth==="called"?"ABS says strike":"ABS says ball"):(team==="you"?"You lose a challenge":CPU.name+" loses a challenge"));
    logMsg("ABS: "+(over?"call overturned, it’s a "+(c.truth==="called"?"strike":"ball")+".":"call stands. "+(team==="you"?"You have ":CPU.name+" has ")+S.chal[team]+" left."));
    setTimeout(()=>{S.abs=null;callPitch(over?c.truth:c.call);},1500);
  },1900);
}

// ---------- Steal, sac fly, pickoff ----------
function toggleSteal(i){
  if(batTeam()!=="you"||S.over)return;
  if(S.P&&S.P.done===false&&performance.now()>S.P.t0+S.P.dur*0.5)return;
  S.stealOn=S.stealOn===i?null:i;renderPanel();
}
function toggleSac(){if(batTeam()!=="you"||S.over)return;S.sacOn=!S.sacOn;renderPanel();}
function sacSwing(P){
  P.swung=true;P.done=true;S.sacOn=false;
  const b=curBatter(),now=performance.now(),cp=ballPos(P,(now-P.t0)/P.dur);
  S.ring={x:cp[0],y:cp[1],t:now};
  const roll=Math.random(),good=0.55+(b.pw-60)/100;
  let type="OUT",deep=true;
  if(roll<0.1)type="2B";else if(roll>=0.1+good*0.9)deep=false;
  S.Hit={from:[cp[0],cp[1]],to:[180+rnd(-110,110),type==="2B"?128:(deep?132:172)],h:80,dur:1300,r1:2.5,t0:now};
  S.phase="hit";
  setTimeout(()=>inPlay(type,"fly",deep,b,Math.random()<.5?"pull":"oppo"),1380);
}
function pickoff(i){
  if(!["select","aim"].includes(S.phase)||batTeam()!=="cpu")return;
  const r=S.bases[i];if(!r||(S.diseng||0)>=2)return;
  S.diseng=(S.diseng||0)+1;
  const bigLead=S.cpuWillSteal===i,bn=["first","second","third"][i];
  const pOut=(bigLead?0.4:0.12)-(r.s>90?0.04:0),roll=Math.random();
  if(roll<pOut){
    S.bases[i]=null;S.outs++;S.cpuWillSteal=null;
    logMsg("Picked off! "+r.n+" is out at "+bn+".");showCall("Picked off!",r.n);renderBoard();
    if(S.outs>=3){S.b=0;S.s=0;S.phase="idle";renderPanel();return setTimeout(endHalf,1700);}
  }else if(roll<pOut+0.05){
    let runs=0;for(let j=2;j>=0;j--){if(S.bases[j]){if(j===2)runs++;else S.bases[j+1]=S.bases[j];S.bases[j]=null;}}
    addRuns("cpu",runs);logMsg("Throwing error on the pickoff. Runners move up"+(runs?" and a run scores.":"."));
    showCall("Throwing error",runs?"Run scores":"Runners advance");
    if(S.half===1&&S.inn>=S.innings&&total("cpu")>total("you")){S.phase="idle";renderPanel();return setTimeout(gameOver,1600);}
  }else{
    if(bigLead&&Math.random()<0.5)S.cpuWillSteal=null;
    logMsg(r.n+" dives back in time.");showCall("Safe",(2-S.diseng)+" pickoff"+(2-S.diseng===1?"":"s")+" left");
  }
  renderBoard();renderPanel();
}

// ---------- Outcomes ----------
function hitResult(e,b,cp,dir,cpuSide){
  let type;
  if(e>0.98)type="HR";
  else if(e>0.88)type=(b.s>88&&Math.random()<0.3)?"3B":"2B";
  else if(e>0.7)type=Math.random()<(cpuSide?0.7:0.6+(b.c-80)/100)?"1B":"OUT";
  else if(e>0.5)type=Math.random()<(cpuSide?0.32:0.25)?"1B":"OUT";
  else type="OUT";
  let kind=null,deep=false;
  if(type==="OUT"){kind=e>0.6?pick(["fly","line"]):pick(["ground","ground","fly"]);deep=kind==="fly"&&e>0.62;}
  const side=dir==="pull"?(cpuSide?1:-1):(cpuSide?-1:1);
  let to,h,dur=1000,r1=3;
  if(type==="HR"){to=[180+side*rnd(30,120),36];h=90;dur=1400;r1=1.5;}
  else if(type==="2B"||type==="3B"){to=[180+side*rnd(80,150),128];h=55;}
  else if(type==="1B"){to=[180+side*rnd(20,110),rnd(150,175)];h=type&&Math.random()<.5?8:30;}
  else if(kind==="ground"){to=[180+side*rnd(20,100),rnd(232,260)];h=4;dur=700;r1=4;}
  else if(kind==="line"){to=[180+side*rnd(30,110),rnd(190,230)];h=14;dur=650;}
  else{to=[180+side*rnd(0,120),deep?132:rnd(150,180)];h=deep?80:60;dur=1300;r1=2.5;}
  S.Hit={from:cp,to,h,dur,r1,t0:performance.now()};
  S.phase="hit";
  setTimeout(()=>inPlay(type,kind,deep,b,dir),dur+80);
}
const SPOT={pull:["left","left-center"],oppo:["right","right-center"]};
function inPlay(type,kind,deep,b,dir){
  if(S.mode==="mission")return missionPitch(type);
  S.stealOn=null;
  if(batTeam()==="cpu")S.cpuDry=type==="OUT"?(S.cpuDry||0)+1:0;
  const t=batTeam(),mine=t==="you",st=mine?S.st[b.n]:null;
  let runs=0,text="",big="",sub="";
  if(type!=="OUT"){
    runs=advance(type,b);S.hits[t]++;
    if(st){st.ab++;st.h++;if(type==="HR")st.hr++;st.rbi+=runs;}
    const f=pick(dir==="pull"?SPOT.pull:SPOT.oppo);
    text={"1B":pick(["lines a single to "+f,"bloops a single into "+f,"grounds a single through the infield"]),
          "2B":"rips a double into the "+f+" gap","3B":"legs out a triple to "+f,
          "HR":pick(["crushes a home run to "+f,"launches one over the "+f+" wall","hits a no-doubter to "+f])}[type];
    big={"1B":"Single","2B":"Double","3B":"Triple","HR":"Home run!"}[type];
    if(type==="HR"&&navigator.vibrate)navigator.vibrate([40,40,80]);
  }else{
    const r=recordOut(kind,deep);runs=r.r;
    const f=kind==="ground"?pick(["short","second","third","first"]):pick(["left","center","right"]);
    if(r.dp){text="grounds into a double play";big="Double play";}
    else if(r.sac){text="hits a sacrifice fly to "+f;big="Sac fly";}
    else{text=(kind==="ground"?"grounds out to ":kind==="line"?"lines out to ":"flies out to ")+f;big="Out";}
    if(st){if(!r.sac)st.ab++;st.rbi+=runs;}
  }
  if(runs)sub=runs+(runs>1?" runs score":" run scores");
  addRuns(t,runs);
  logMsg(b.n+" "+text+(runs?". "+sub+".":"."));
  showCall(big,sub);
  endPA();
}
function advance(type,bat){
  const B=S.bases;let r=0;
  if(type==="BB"){if(B[0]){if(B[1]){if(B[2])r++;B[2]=B[1];}B[1]=B[0];}B[0]=bat;}
  else if(type==="1B"){if(B[2]){r++;B[2]=null;}if(B[1]){r++;B[1]=null;}if(B[0]){if(B[0].s>=90&&Math.random()<0.5)B[2]=B[0];else B[1]=B[0];}B[0]=bat;}
  else if(type==="2B"){if(B[2])r++;if(B[1])r++;let n3=null;if(B[0]){if(B[0].s>=85&&Math.random()<0.55)r++;else n3=B[0];}S.bases=[null,bat,n3];}
  else if(type==="3B"){r=B.filter(Boolean).length;S.bases=[null,null,bat];}
  else if(type==="HR"){r=B.filter(Boolean).length+1;S.bases=[null,null,null];}
  return r;
}
function recordOut(kind,deep){
  const B=S.bases;let r=0,outs=1,dp=false,sac=false;
  if(kind==="ground"){
    if(B[0]&&S.outs<2&&Math.random()<0.45){outs=2;dp=true;B[0]=null;}
    if(S.outs+outs<3){if(B[2]){r++;B[2]=null;}if(B[1]){B[2]=B[1];B[1]=null;}if(B[0]){B[1]=B[0];B[0]=null;}}
  }else if(kind==="fly"&&deep&&B[2]&&S.outs<2){r=1;B[2]=null;sac=true;}
  S.outs+=outs;return{r,dp,sac};
}
function addRuns(t,n){S.runs[t][S.inn-1]=(S.runs[t][S.inn-1]||0)+n;renderBoard();}
function callPitch(k){
  if(S.mode==="mission")return missionPitch(k);
  const b=curBatter(),mine=batTeam()==="you";
  if(S.stealOn!=null){
    const from=S.stealOn,r=S.bases[from];S.stealOn=null;
    if(r&&!S.bases[from+1]){
      if(k==="foul"){S.note="Runner goes back";}
      else{
        const strongArm=!mine&&MY.lineup.some(x=>x.p==="C"&&x.c>=95)?0.08:0;
        const ok=Math.random()<clamp(0.3+r.s/100*0.55-strongArm,0.35,0.9);
        const bn=from===0?"second":"third";
        if(ok){S.bases[from+1]=r;S.bases[from]=null;S.note=r.n.split(" ").slice(1).join(" ")+" steals "+bn;logMsg(r.n+" steals "+bn+"!");}
        else{S.bases[from]=null;S.outs++;S.note="Caught stealing";logMsg(r.n+" is caught stealing "+bn+".");
          if(!mine)S.cpuDry=(S.cpuDry||0);
          if(S.outs>=3){S.b=0;S.s=0;renderBoard();S.note="";showCall("Caught stealing","Inning over");S.phase="idle";renderPanel();setTimeout(endHalf,1700);return;}}
      }
    }
  }
  if(k==="swinging"||k==="called"){if(S.s===2&&!mine)S.cpuDry=(S.cpuDry||0)+1;}
  if(k==="ball"&&S.b===3&&!mine)S.cpuDry=0;
  if(k==="ball"){S.b++;if(S.b===4){const r=advance("BB",b);if(mine){S.st[b.n].bb++;S.st[b.n].rbi+=r;}addRuns(batTeam(),r);logMsg(b.n+" walks"+(r?". A run scores.":"."));showCall("Ball four",r?"Run scores":"");endPA();return;}showCall("Ball "+S.b,S.last);}
  else if(k==="foul"){if(S.s<2)S.s++;showCall("Foul",S.last);}
  else{S.s++;if(S.s===3){S.outs++;if(mine){S.st[b.n].ab++;S.st[b.n].k++;}logMsg(b.n+(k==="called"?" is caught looking.":" strikes out swinging."));showCall("Strike three",k==="called"?"Caught looking":"Swinging");endPA();return;}
    showCall(k==="called"?"Strike":"Swing and a miss",S.P&&S.P.pending?S.P.pending.why:S.last);}
  renderBoard();S.phase="idle";renderPanel();
  setTimeout(nextPitch,1300);
}
function endPA(){
  const t=batTeam();S.b=0;S.s=0;S.idx[t]++;S.diseng=0;S.stealOn=null;S.sacOn=false;renderBoard();S.phase="idle";
  if(S.half===1&&S.inn>=S.innings&&total("cpu")>total("you")){return setTimeout(()=>gameOver(),1600);}
  if(S.outs>=3){setTimeout(endHalf,1700);}else setTimeout(nextPitch,1700);
  renderPanel();
}
function endHalf(){
  if(S.half===0){
    if(S.inn>=S.innings&&total("cpu")>total("you"))return gameOver();
    S.half=1;startHalf();
  }else{
    if(S.inn>=S.innings&&total("you")!==total("cpu"))return gameOver();
    S.inn++;S.half=0;startHalf();
  }
}
function gameOver(){S.over=true;S.phase="over";renderBoard();renderPanel();
  const y=total("you"),c=total("cpu");showCall(y>c?"Ballgame!":"Final",y+"–"+c);}

// ---------- Effects ----------
function foulAnim(cp){S.Hit={from:cp,to:[cp[0]<180?-20:380,rnd(60,140)],h:40,dur:650,r1:3,t0:performance.now()};}

// ---------- Rendering: board ----------
function renderBoard(){
  const el=document.getElementById("board");
  if(S&&S.mode==="mission"){
    const M=S.mission,dots=(k,m)=>'<div class="dots">'+Array.from({length:m},(_,i)=>'<i class="dot'+(i<k?" on":"")+'"></i>').join("")+"</div>";
    el.innerHTML=`<table class="line"><tr><td class="tm" style="width:auto">${M.t}</td><td class="r" style="text-align:right">${M.prog} / ${M.need}</td></tr></table>
      <div class="status"><div class="count"><span>${M.type==="bat"?"Swings":"Pitches"}</span>${dots(M.shots-M.used,M.shots)}</div>
      <div class="readout">${M.unit}<b>${S.last?S.last.split(" mph")[0]:"--"}</b>${S.last?S.last.split("mph ")[1]:"mph"}</div></div>`;
    return;
  }
  if(!S){el.innerHTML='<table class="line"><tr><th style="text-align:left">Diamond 26</th></tr></table>';return;}
  const n=Math.max(S.innings,S.inn);let h='<table class="line"><tr><th></th>';
  for(let i=1;i<=n;i++)h+="<th>"+i+"</th>";h+="<th>R</th><th>H</th><th>ABS</th></tr>";
  [["you",MY.abbr],["cpu",CPU.abbr]].forEach(([t,a])=>{
    h+='<tr><td class="tm">'+a+"</td>";
    for(let i=0;i<n;i++){let v=S.runs[t][i];if(v===undefined&&S.over&&t==="cpu"&&i===S.inn-1)v="X";h+="<td>"+(v===undefined?"":v)+"</td>";}
    h+='<td class="r">'+total(t)+"</td><td>"+S.hits[t]+"</td><td>"+S.chal[t]+"</td></tr>";
  });
  h+="</table>";
  const dots=(k,m)=>'<div class="dots">'+Array.from({length:m},(_,i)=>'<i class="dot'+(i<k?" on":"")+'"></i>').join("")+"</div>";
  const B=S.bases,sq=(on,x,y)=>`<rect x="${x}" y="${y}" width="11" height="11" transform="rotate(45 ${x+5.5} ${y+5.5})" fill="${on?"var(--bulb)":"var(--bulb-off)"}"/>`;
  h+='<div class="status"><div class="count"><span>B</span>'+dots(S.b,3)+"<span>S</span>"+dots(S.s,2)+"<span>O</span>"+dots(S.outs,2)+"</div>";
  h+='<svg width="52" height="40" viewBox="0 0 52 40" aria-label="Bases">'+sq(B[1],20,3)+sq(B[0],36,18)+sq(B[2],4,18)+"</svg>";
  h+='<div class="readout">'+(S.half?"Bot ":"Top ")+ord(S.inn)+"<b>"+(S.last?S.last.split(" mph")[0]:"--")+'</b>'+(S.last?S.last.split("mph ")[1]:"mph")+"</div></div>";
  el.innerHTML=h;
}

// ---------- Rendering: panel ----------
function rateRows(b){return '<div class="rate">'+[["Contact",b.c],["Power",b.pw],["Speed",b.s]].map(([l,v])=>`<span>${l}</span><div class="bar"><i style="width:${v}%"></i></div><span>${v}</span>`).join("")+"</div>";}
function todayLine(n){const s=S.st[n];if(!s)return"";if(!s.ab&&!s.bb)return"First at-bat today";let t=s.h+"-for-"+s.ab;if(s.hr)t+=", "+(s.hr>1?s.hr+" HR":"HR");if(s.rbi)t+=", "+s.rbi+" RBI";if(s.bb)t+=", "+s.bb+" BB";return t;}
function renderPanel(){
  const el=document.getElementById("panel");

  if(S.phase==="mission-over"){
    const M=S.mission;
    el.innerHTML=`<div class="sub">${M.d}</div><div class="final">${S.missionWon?"Complete":"Failed"}</div>
      <div class="today">${M.unit}: ${M.prog} of ${M.need}, using ${M.used} of ${M.shots} ${M.type==="bat"?"swings":"pitches"}.</div>
      <button class="go" data-a="retry">Try again</button><button class="ghost" style="width:100%;margin-top:8px" data-a="menu">Back to menu</button>`;

  }
  if(S.phase==="over"){
    const y=total("you"),c=total("cpu"),perf=MY.lineup.map(b=>({b,s:S.st[b.n]})).filter(x=>x.s.h||x.s.rbi).sort((a,b)=>(b.s.h*2+b.s.hr*3+b.s.rbi)-(a.s.h*2+a.s.hr*3+a.s.rbi)).slice(0,3);

  }

    const c=S.pend,mine=batTeam()==="you";
    el.innerHTML=`<div class="who"><h2>${c.call==="called"?"Called strike":"Called ball"}</h2><span class="pos">${S.chal.you} challenge${S.chal.you===1?"":"s"} left</span></div>
      <div class="today">${mine?b.n+" can":myPitcher().n+" can"} challenge. ABS will check the pitch against the zone.</div>

    const p=cpuPitcher();
    el.innerHTML=`<div class="who"><h2>${b.n}</h2><span class="pos">${b.p} · ${b.o} OVR</span></div><div class="today">${todayLine(b.n)}</div>${rateRows(b)}
      <p class="hint">Tap the ball as it reaches the plate to swing. Let it go to take the pitch. Facing ${p.n} (${S.cpuPC} pitches). Delivery: ${styleOf(p).d.toLowerCase()}.</p>`;
    if(S.mode==="game"){
      const B=S.bases,btns=[];
      if(B[0]&&!B[1])btns.push(`<button class="pbtn${S.stealOn===0?" sel":""}" data-a="steal" data-i="0">${S.stealOn===0?"Running":"Steal 2nd"}<small>${B[0].n.split(" ").slice(1).join(" ")}, spd ${B[0].s}</small></button>`);
      if(B[1]&&!B[2])btns.push(`<button class="pbtn${S.stealOn===1?" sel":""}" data-a="steal" data-i="1">${S.stealOn===1?"Running":"Steal 3rd"}<small>${B[1].n.split(" ").slice(1).join(" ")}, spd ${B[1].s}</small></button>`);
      if(B[2]&&S.outs<2)btns.push(`<button class="pbtn${S.sacOn?" sel":""}" data-a="sac">${S.sacOn?"Sac fly on":"Sac fly"}<small>Lift it to score</small></button>`);
      if(btns.length)el.innerHTML+=`<div class="pitches">${btns.join("")}</div>${S.stealOn!=null?'<p class="hint">The runner goes on the next pitch.</p>':""}${S.sacOn?'<p class="hint">Your batter will lift a fly ball on the next pitch.</p>':""}`;
    }
  }else{
    const p=myPitcher(),{e,pc}=fatigue();

      <div class="pitches">${p.ar.map((a,i)=>`<button class="pbtn${S.sel===i?" sel":""}" data-a="pitch" data-i="${i}">${a[0]}<small>${a[1]} mph</small></button>`).join("")}</div>`;
    if(S.mode==="game"&&["select","aim"].includes(S.phase)&&S.bases.some(Boolean)){
      const left=2-(S.diseng||0);
      body+=`<div class="pitches">${S.bases.map((r,i)=>r?`<button class="pbtn" data-a="pick" data-i="${i}" ${left<=0?"disabled style=\"opacity:.45\"":""}>Pick off ${["1st","2nd","3rd"][i]}<small>${r.n.split(" ").slice(1).join(" ")}, spd ${r.s}</small></button>`:"").join("")}</div>

    el.innerHTML=body;
  }
}

document.getElementById("panel").addEventListener("click",ev=>{
  const btn=ev.target.closest("button");if(!btn)return;const a=btn.dataset.a,i=btn.dataset.i;
  if(a==="set"){const k=btn.dataset.k;setup[k]=isNaN(+i)?i:+i;if(k==="mine"){setup.starter=0;setup.batter=0;}renderPanel();}
  else if(a==="mstart"){startMission();}
  else if(a==="retry"){startMission();}
  else if(a==="start"||a==="again"){document.getElementById("log").innerHTML="";newGame();}
  else if(a==="menu"){S=null;document.getElementById("log").innerHTML="";renderBoard();renderPanel();}
  else if(a==="pitch")choosePitch(+i);
  else if(a==="release")release();
  else if(a==="challenge"){if(S.phase==="challenge")runChallenge("you");}
  else if(a==="accept")acceptCall();
  else if(a==="steal")toggleSteal(+i);
  else if(a==="sac")toggleSac();
  else if(a==="pick")pickoff(+i);
  else if(a==="bullpen"){if(["select","aim","meter"].includes(S.phase)){S.phase="bullpen";renderPanel();}}
  else if(a==="sub"){S.myP=+i;logMsg(MY.rotation[S.myP].n+" comes in to pitch.");S.phase="select";S.sel=null;renderPanel();}
  else if(a==="nosub"){S.phase="select";renderPanel();}
});
cv.addEventListener("pointerdown",ev=>{
  if(!S)return;const r=cv.getBoundingClientRect(),x=(ev.clientX-r.left)*W/r.width,y=(ev.clientY-r.top)*H/r.height,now=performance.now();
  if(S.phase==="flight-bat")swing(x,y,now);
  else if(S.phase==="aim")aimAt(x,y);
  else if(S.phase==="meter")release();
});

// release point in screen space, matching the drawn delivery
function releasePoint(p){
  const st=styleOf(p),sd=p.hand==="R"?-1:1,k=st.k;
  const x=180+sd*(1+15*st.slot)*st.arm,y=177+19*st.slot-(st.arm-1)*8;
  return [180+(x-180)*k,232+(y-2-232)*k];
}

    else if(P.mode==="bat"){
      if(P.pending&&t>=1){P.done=true;callPitch("swinging");}
      else if(!P.swung&&t>1+S.D.ok/P.dur+0.02)resolveTake();
    }else if(t>=1)resolveCpuAB();
  }
  if(S&&S.phase==="challenge"){const left=S.chalEnd-now,el=document.getElementById("ctimer");if(el)el.style.width=clamp(left/4500,0,1)*100+"%";if(left<=0)acceptCall();}
  if(S&&S.phase==="meter"){const n=document.getElementById("needle");if(n)n.style.left=(meterPos(now)*100)+"%";}
  ctx.clearRect(0,0,W,H);
  drawField(now);drawFielders();drawRunners(now);drawPitcher(now);drawZone(now);drawBatter(now);drawBall(now);drawRing(now);drawCaption(now);drawCam(now);drawABS(now);
  requestAnimationFrame(tick);
}
resize();renderBoard();renderPanel();requestAnimationFrame(tick);
</script>
</body>
